# Publicação no Netlify.
#
# O site é estático (`output: "export"` no next.config.ts), então o Netlify só
# roda o build e serve a pasta out/ — não precisa do plugin de Next.js nem de
# nenhuma função.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Os arquivos do Next levam hash no nome: podem ficar em cache para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos e vídeos não têm hash — cache de uma semana, para trocar uma imagem
# sem esperar um ano pelo navegador de quem já visitou.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
