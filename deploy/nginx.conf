# Site estático do Made in Chapa.
#
# Convive com o server block do sistema financeiro na mesma VPS: são domínios
# diferentes, e este aqui não faz proxy para porta nenhuma — serve arquivo do
# disco. Trocar DOMINIO pelo domínio real antes de aplicar.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    root /var/www/madeinchapa-site;
    index index.html;

    # trailingSlash: true no next.config.ts -> /pagina/ existe como diretório
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Os assets do Next levam hash no nome: cache longo é seguro.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fotos e vídeos não têm hash — cache médio, para trocar sem esperar um ano.
    location ~* \.(webp|jpg|jpeg|png|svg|mp4|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/madeinchapa-site.access.log;
    error_log  /var/log/nginx/madeinchapa-site.error.log;
}
